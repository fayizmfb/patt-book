<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patt Book - Retailer Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .tab-button.active {
            background-color: #3b82f6;
            color: white;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Patt Book</h1>
            <p class="text-gray-600 mt-2">Retailer Ledger System</p>
        </div>

        <!-- Main Card -->
        <div class="bg-white shadow-lg rounded-lg p-8">
            <!-- Tab Buttons -->
            <div class="flex mb-6 border-b">
                <button onclick="switchTab('login')" id="login-tab" class="tab-button active flex-1 py-3 px-4 text-center font-medium rounded-tl-lg transition-colors">
                    Login
                </button>
                <button onclick="switchTab('signup')" id="signup-tab" class="tab-button flex-1 py-3 px-4 text-center font-medium rounded-tr-lg transition-colors">
                    Sign Up
                </button>
            </div>

            <!-- Login Form -->
            <div id="login-content" class="tab-content active">
                <form id="login-form" class="space-y-4">
                    <div>
                        <label for="login-phone" class="block text-sm font-medium text-gray-700 mb-2">
                            Phone Number
                        </label>
                        <input type="tel" id="login-phone" name="phone" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="Enter 10-digit phone number"
                               maxlength="10">
                    </div>

                    <div>
                        <label for="login-pin" class="block text-sm font-medium text-gray-700 mb-2">
                            PIN
                        </label>
                        <input type="password" id="login-pin" name="pin" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="Enter 4-6 digit PIN"
                               maxlength="6">
                    </div>

                    <div id="login-error" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-md">
                        <p class="text-sm"></p>
                    </div>

                    <div id="login-success" class="hidden bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-md">
                        <p class="text-sm"></p>
                    </div>

                    <button type="submit" id="login-btn"
                            class="w-full bg-blue-600 text-white py-3 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors font-medium">
                        Login
                    </button>
                </form>
            </div>

            <!-- Signup Form -->
            <div id="signup-content" class="tab-content">
                <form id="signup-form" class="space-y-4">
                    <div>
                        <label for="signup-phone" class="block text-sm font-medium text-gray-700 mb-2">
                            Phone Number *
                        </label>
                        <input type="tel" id="signup-phone" name="phone" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="Enter 10-digit phone number"
                               maxlength="10">
                    </div>

                    <div>
                        <label for="signup-shop-name" class="block text-sm font-medium text-gray-700 mb-2">
                            Shop Name *
                        </label>
                        <input type="text" id="signup-shop-name" name="shop_name" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="Enter your shop name">
                    </div>

                    <div>
                        <label for="signup-address" class="block text-sm font-medium text-gray-700 mb-2">
                            Shop Address *
                        </label>
                        <textarea id="signup-address" name="shop_address" required rows="3"
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                  placeholder="Enter your shop address"></textarea>
                    </div>

                    <div>
                        <label for="signup-photo" class="block text-sm font-medium text-gray-700 mb-2">
                            Shop Photo (Optional)
                        </label>
                        <input type="url" id="signup-photo" name="shop_photo_url"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="https://example.com/shop-photo.jpg">
                    </div>

                    <div>
                        <label for="signup-pin" class="block text-sm font-medium text-gray-700 mb-2">
                            Set PIN *
                        </label>
                        <input type="password" id="signup-pin" name="pin" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="Enter 4-6 digit PIN"
                               maxlength="6">
                    </div>

                    <div>
                        <label for="signup-confirm-pin" class="block text-sm font-medium text-gray-700 mb-2">
                            Confirm PIN *
                        </label>
                        <input type="password" id="signup-confirm-pin" name="confirm_pin" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="Confirm your PIN"
                               maxlength="6">
                    </div>

                    <div id="signup-error" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-md">
                        <p class="text-sm"></p>
                    </div>

                    <div id="signup-success" class="hidden bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-md">
                        <p class="text-sm"></p>
                    </div>

                    <button type="submit" id="signup-btn"
                            class="w-full bg-green-600 text-white py-3 px-4 rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition-colors font-medium">
                        Create Account
                    </button>
                </form>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6 text-sm text-gray-600">
            <p>Secure Phone + PIN Authentication</p>
        </div>
    </div>

    <script>
        let deviceId = localStorage.getItem('device_id') || generateDeviceId();
        localStorage.setItem('device_id', deviceId);

        function generateDeviceId() {
            return 'device_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
        }

        function switchTab(tab) {
            // Hide all content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            // Remove active class from all buttons
            document.querySelectorAll('.tab-button').forEach(button => {
                button.classList.remove('active');
            });
            
            // Show selected content and activate button
            if (tab === 'login') {
                document.getElementById('login-content').classList.add('active');
                document.getElementById('login-tab').classList.add('active');
            } else {
                document.getElementById('signup-content').classList.add('active');
                document.getElementById('signup-tab').classList.add('active');
            }
        }

        function showError(form, message) {
            const errorDiv = document.getElementById(`${form}-error`);
            const successDiv = document.getElementById(`${form}-success`);
            
            errorDiv.querySelector('p').textContent = message;
            errorDiv.classList.remove('hidden');
            successDiv.classList.add('hidden');
        }

        function showSuccess(form, message) {
            const errorDiv = document.getElementById(`${form}-error`);
            const successDiv = document.getElementById(`${form}-success`);
            
            successDiv.querySelector('p').textContent = message;
            successDiv.classList.remove('hidden');
            errorDiv.classList.add('hidden');
        }

        function hideMessages(form) {
            document.getElementById(`${form}-error`).classList.add('hidden');
            document.getElementById(`${form}-success`).classList.add('hidden');
        }

        // Phone number validation
        function validatePhone(phone) {
            const cleanPhone = phone.replace(/\D/g, '');
            return cleanPhone.length === 10;
        }

        // PIN validation
        function validatePin(pin) {
            return pin.length >= 4 && pin.length <= 6 && /^\d+$/.test(pin);
        }

        // Login form handler
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages('login');
            
            const phone = document.getElementById('login-phone').value;
            const pin = document.getElementById('login-pin').value;
            
            if (!validatePhone(phone)) {
                showError('login', 'Please enter a valid 10-digit phone number');
                return;
            }
            
            if (!validatePin(pin)) {
                showError('login', 'PIN must be 4-6 digits');
                return;
            }

            const loginBtn = document.getElementById('login-btn');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        phone: phone,
                        pin: pin,
                        device_id: deviceId
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('login', data.message);
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('retailer', JSON.stringify(data.retailer));
                    localStorage.setItem('device_id', data.device_id);
                    
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    showError('login', data.message);
                }
            } catch (error) {
                showError('login', 'Network error. Please try again.');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });

        // Signup form handler
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages('signup');
            
            const phone = document.getElementById('signup-phone').value;
            const shopName = document.getElementById('signup-shop-name').value;
            const shopAddress = document.getElementById('signup-address').value;
            const shopPhotoUrl = document.getElementById('signup-photo').value;
            const pin = document.getElementById('signup-pin').value;
            const confirmPin = document.getElementById('signup-confirm-pin').value;
            
            if (!validatePhone(phone)) {
                showError('signup', 'Please enter a valid 10-digit phone number');
                return;
            }
            
            if (shopName.length < 2) {
                showError('signup', 'Shop name must be at least 2 characters');
                return;
            }
            
            if (shopAddress.length < 5) {
                showError('signup', 'Shop address must be at least 5 characters');
                return;
            }
            
            if (!validatePin(pin)) {
                showError('signup', 'PIN must be 4-6 digits');
                return;
            }
            
            if (pin !== confirmPin) {
                showError('signup', 'PINs do not match');
                return;
            }

            const signupBtn = document.getElementById('signup-btn');
            signupBtn.disabled = true;
            signupBtn.textContent = 'Creating account...';

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        phone: phone,
                        shop_name: shopName,
                        shop_address: shopAddress,
                        shop_photo_url: shopPhotoUrl,
                        pin: pin,
                        confirm_pin: confirmPin,
                        device_id: deviceId
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('signup', data.message);
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('retailer', JSON.stringify(data.retailer));
                    localStorage.setItem('device_id', data.device_id);
                    
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    showError('signup', data.message);
                }
            } catch (error) {
                showError('signup', 'Network error. Please try again.');
            } finally {
                signupBtn.disabled = false;
                signupBtn.textContent = 'Create Account';
            }
        });

        // Auto-format phone numbers
        document.querySelectorAll('input[type="tel"]').forEach(input => {
            input.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/\D/g, '');
            });
        });

        // Auto-format PINs
        document.querySelectorAll('input[type="password"]').forEach(input => {
            input.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/\D/g, '');
            });
        });
    </script>
</body>
</html>
